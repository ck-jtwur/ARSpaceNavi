<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AR Space Navigation">
  <defs>
    <radialGradient id="sky" cx="50%" cy="32%" r="76%">
      <stop offset="0%" stop-color="#16305a" />
      <stop offset="58%" stop-color="#070d1c" />
      <stop offset="100%" stop-color="#04060d" />
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#f2f7ff" />
      <stop offset="40%" stop-color="#7fb2ff" />
      <stop offset="100%" stop-color="#255196" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sky)" />

  <!-- 環は惑星の後ろ側を先に描き、手前側だけを惑星の上に重ねる -->
  <g transform="rotate(-22 32 32)" fill="none" stroke="#9ec8ff" stroke-width="3.2" stroke-linecap="round">
    <ellipse cx="32" cy="32" rx="24" ry="8.4" opacity="0.55" />
  </g>

  <circle cx="32" cy="32" r="14" fill="url(#planet)" />

  <g transform="rotate(-22 32 32)" fill="none" stroke="#9ec8ff" stroke-width="3.2" stroke-linecap="round">
    <path d="M8 32A24 8.4 0 0 0 56 32" />
  </g>

  <!-- 遠くの星 -->
  <circle cx="50.5" cy="13.5" r="2.1" fill="#eaf3ff" />
  <circle cx="13.5" cy="50" r="1.6" fill="#eaf3ff" opacity="0.85" />
</svg>
